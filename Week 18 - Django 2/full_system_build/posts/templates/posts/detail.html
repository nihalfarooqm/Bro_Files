{% extends "base.html" %}

{% block content %}

<h2>{{ post.title }}</h2>
<p>{{ post.content }}</p>

<div>
    <p>Post by: {{ post.author }}</p>
</div>

{% if request.user == post.author %}
    <a href="{% url 'posts:update' post.id %}">Edit</a>
    <a href="{% url 'posts:delete' post.id %}">Delete</a>
{% endif %}

{% endblock %}
