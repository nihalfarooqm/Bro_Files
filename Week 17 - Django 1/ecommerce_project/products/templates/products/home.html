{% extends "base.html" %}

{% block content %}
<h2>All Products</h2>

{% for product in products %}
    <div>
        <a href="{% url 'products:detail' product.id %}">
            {{ product.name }}
        </a>
        - ₹{{ product.price }}
    </div>
{% empty %}
    <p>No products found</p>
{% endfor %}

{% endblock %}
